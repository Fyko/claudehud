name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Install MUSL Tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools

      # No build cache here on purpose. A release build publishes signed
      # artifacts, and the Actions cache is writable from any branch — a
      # poisoned entry would be baked straight into a tagged binary
      # (zizmor: cache-poisoning). Release builds are cold builds.

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p claudehud -p claudehud-daemon

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir dist
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          cp target/${{ matrix.target }}/release/claudehud${ext} \
            dist/claudehud-${{ matrix.target }}${ext}
          cp target/${{ matrix.target }}/release/claudehud-daemon${ext} \
            dist/claudehud-daemon-${{ matrix.target }}${ext}

      - name: Emit Checksums (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          for f in *; do
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" > "$f.sha256"
            else
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Emit Checksums (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -notlike '*.sha256' } |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii -NoNewline
            }

      - name: Attest claudehud
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/claudehud-${{ matrix.target }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}

      - name: Attest claudehud-daemon
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/claudehud-daemon-${{ matrix.target }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      # `gh` ships on the runner, so publishing needs no third-party action in
      # the path that signs and uploads release binaries (zizmor:
      # superfluous-actions). The tag goes through the environment rather than
      # inline interpolation, keeping it out of the shell's parse.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes
