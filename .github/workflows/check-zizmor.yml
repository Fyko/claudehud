on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    name: "zizmor"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          # Uploading SARIF needs GitHub Advanced Security, which this repo
          # doesn't have; findings come through as PR annotations instead.
          advanced-security: false
          annotations: true
