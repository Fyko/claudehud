on:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    name: "zizmor"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          # Uploading SARIF needs GitHub Advanced Security, which this repo
          # doesn't have; findings come through as PR annotations instead.
          advanced-security: false
          annotations: true
